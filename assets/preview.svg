<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="now-playing: Lil Peep — Gym Class above the prompt and next to the model picker">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .track { fill: #e8e6e1; font-size: 15px; }
    .dim { fill: #8f8d87; font-size: 13px; }
    .hint { fill: #6f6d68; font-size: 15px; }
    .bar { fill: #d97757; }
  </style>

  <rect width="820" height="250" rx="16" fill="#1f1e1c"/>

  <!-- the band above the prompt -->
  <g transform="translate(318 56)">
    <rect class="bar" x="0" width="4" rx="1" y="-6" height="6">
      <animate attributeName="height" values="6;14;9;16;6" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-14;-9;-16;-6" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="7" width="4" rx="1" y="-14" height="14">
      <animate attributeName="height" values="14;7;16;9;14" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-14;-7;-16;-9;-14" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="14" width="4" rx="1" y="-9" height="9">
      <animate attributeName="height" values="9;16;6;13;9" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-9;-16;-6;-13;-9" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <text class="track" x="28" y="0">Lil Peep — Gym Class</text>
  </g>

  <!-- the prompt -->
  <rect x="32" y="80" width="756" height="96" rx="14" fill="#2b2a27" stroke="#3d3c38"/>
  <text class="hint" x="56" y="116">Введите / для вызова команд</text>

  <!-- the status line -->
  <text class="dim" x="40" y="212">Авто</text>
  <g transform="translate(468 212)">
    <rect class="bar" x="0" width="3" rx="1" y="-4" height="4">
      <animate attributeName="height" values="4;10;6;11;4" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-4;-10;-6;-11;-4" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="5" width="3" rx="1" y="-10" height="10">
      <animate attributeName="height" values="10;5;11;6;10" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-5;-11;-6;-10" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect class="bar" x="10" width="3" rx="1" y="-6" height="6">
      <animate attributeName="height" values="6;11;4;9;6" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-6;-11;-4;-9;-6" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <text class="dim" x="20" y="0">Lil Peep — Gym Class</text>
  </g>
  <text class="dim" x="780" y="212" text-anchor="end">Opus 5.5  Средний</text>
</svg>
